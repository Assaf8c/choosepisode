<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="description" content="הגרלת פרק רנדומלי מתוך הסדרות שלך">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="איזה פרק?">
  <title>איזה פרק?</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>איזה פרק?</h1>
    <button id="addBtn" class="btn primary">+ סדרה</button>
  </header>

  <main>
    <section id="empty" class="empty" hidden>
      <p>עוד אין סדרות ברשימה.</p>
      <p>הוסיפו סדרה, ציינו כמה פרקים יש בכל עונה, ותנו לקובייה להחליט מה רואים הערב.</p>
    </section>
    <ul id="list" class="list"></ul>
  </main>

  <!-- טופס הוספה / עריכה -->
  <dialog id="formDialog">
    <form id="seriesForm" method="dialog">
      <h2 id="formTitle">סדרה חדשה</h2>

      <label class="field">
        <span>שם הסדרה</span>
        <input id="nameInput" type="text" required maxlength="80" autocomplete="off" placeholder="למשל: חברים">
      </label>

      <label class="field">
        <span>מספר עונות</span>
        <input id="seasonCountInput" type="number" inputmode="numeric" min="1" max="60" value="1" required>
      </label>

      <div class="same-row">
        <label class="field grow">
          <span>אותו מספר פרקים לכל העונות</span>
          <input id="sameEpisodesInput" type="number" inputmode="numeric" min="1" max="999" placeholder="פרקים">
        </label>
        <button type="button" id="applySameBtn" class="btn">החל</button>
      </div>

      <fieldset>
        <legend>פרקים בכל עונה</legend>
        <div id="seasonsGrid" class="seasons-grid"></div>
      </fieldset>

      <p id="formError" class="error" hidden></p>

      <div class="actions">
        <button type="button" id="cancelBtn" class="btn">ביטול</button>
        <button type="submit" class="btn primary">שמירה</button>
      </div>
    </form>
  </dialog>

  <!-- תוצאת הגרלה -->
  <dialog id="resultDialog">
    <div class="result">
      <p id="resultSeries" class="result-series"></p>
      <div class="result-box">
        <div class="result-cell">
          <span class="label">עונה</span>
          <span id="resultSeason" class="num">–</span>
        </div>
        <div class="result-cell">
          <span class="label">פרק</span>
          <span id="resultEpisode" class="num">–</span>
        </div>
      </div>
      <p id="resultCode" class="result-code"></p>
      <div class="actions">
        <button type="button" id="closeResultBtn" class="btn">סגירה</button>
        <button type="button" id="rerollBtn" class="btn primary">הגרל שוב</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
